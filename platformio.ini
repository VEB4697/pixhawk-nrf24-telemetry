; Pixhawk nRF24 Telemetry - one PlatformIO workspace, one env per role.
;   pio run -e air        -> air unit firmware   (drone side, PRX, Pixhawk UART)
;   pio run -e ground     -> ground unit firmware (GCS side, PTX, USB CDC = COM port)
;   pio run -e ground_uart-> ground unit with USB-TTL PC link (USB CDC free for debug)
;   pio run -e air_selftest / ground_selftest -> bench pattern test, no Pixhawk/PC
;   pio test -e native    -> host-side unit tests for lib/LinkCore (no hardware)
; Target board: ESP32-C3 SuperMini (uses native USB-CDC for `Serial`).

[platformio]
default_envs = air, ground

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    nrf24/RF24 @ ^1.4.11
build_flags =
    -std=gnu++17
    -Iinclude
    -Isrc/common
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11

[env:air]
build_src_filter = -<*> +<common/> +<air/>
build_flags =
    ${env.build_flags}
    -DROLE_AIR=1

[env:ground]                 ; PC link = native USB CDC (Mission Planner / QGC COM port)
build_src_filter = -<*> +<common/> +<ground/>
build_flags =
    ${env.build_flags}
    -DROLE_GROUND=1

[env:ground_uart]            ; PC link = USB-TTL adapter on GPIO20/21; USB CDC used for debug stats
extends = env:ground
build_flags =
    ${env:ground.build_flags}
    -DGROUND_PC_UART=1

; Bench self-test pair: no Pixhawk / PC needed. Stats on each unit's USB console.
; Add -DSELFTEST_RATE_BPS=0 for a max-throughput test (T-03).
[env:air_selftest]
extends = env:air
build_flags =
    ${env:air.build_flags}
    -DSELFTEST=1

[env:ground_selftest]
extends = env:ground
build_flags =
    ${env:ground.build_flags}
    -DSELFTEST=1

; Host tests: pure C++ + Arduino/RF24 fakes from test/stubs (no hardware). Needs g++ (WSL, MinGW or Linux/macOS).
;   test_core / test_bridge           : LinkCore logic and the bridge against a simulated nRF24
;   test_firmware                     : real headers + RadioLink against the fake RF24 (config, brown-out, LED, pins)
;   test_air_main / test_ground_*     : the REAL main.cpp files running against a simulated peer
[env:native]
platform = native
lib_deps =
build_flags = -std=gnu++17 -Wall -Wextra -Itest/stubs -Isrc/common -Iinclude
test_framework = unity
